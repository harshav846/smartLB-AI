server:
  port: 0

spring:
  application:
    name: auth-service-test
  datasource:
    url: jdbc:h2:mem:smartlbal_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE,USER
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 25
    username: test
    password: test

security:
  jwt:
    secret: dGhpc2lzYW1vY2tqd3RzZWNyZXRmb3J0ZXN0aW5ncHVycG9zZXNvbmx5c21hcnRsYg==
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000
    signing-algorithm: HS256

app:
  base-url: http://localhost:8081
  email:
    from: noreply@smartlb.ai
    verification-path: /api/v1/auth/verify-email
    reset-password-path: /api/v1/auth/reset-password
  security:
    max-failed-login-attempts: 5
    refresh-token-expiration-ms: 604800000
