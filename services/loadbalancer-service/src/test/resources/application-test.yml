server:
  port: 0

spring:
  application:
    name: loadbalancer-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

security:
  jwt:
    secret: dGhpc2lzYWZha2VzZWNyZXRrZXlmb3J0ZXN0aW5ncHVycG9zZXNvbmx5c21hcnRsYmFpMTIzNA==
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000

app:
  health-check:
    enabled: true
    interval-ms: 60000
    failure-threshold: 3
    timeout-ms: 2000
  proxy:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    max-retries: 1
  security:
    ssrf:
      allow-loopback: true
